apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-shadow
  template:
    metadata:
      labels:
        app: aceest-fitness-shadow
    spec:
      containers:
        - name: aceest-fitness
          image: arutselvans/aceest-fitness:1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
